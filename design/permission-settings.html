<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>页面访问权限设置 - 科技风格</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Microsoft YaHei', 'PingFang SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d1f3c 50%, #0a1628 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    /* 背景动画效果 */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
      border-radius: 50%;
      top: -250px;
      left: -250px;
      animation: glow1 8s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 255, 128, 0.08) 0%, transparent 70%);
      border-radius: 50%;
      bottom: -200px;
      right: -200px;
      animation: glow2 10s ease-in-out infinite;
    }

    @keyframes glow1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.2); }
    }

    @keyframes glow2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-30px, -30px) scale(1.1); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1200px;
    }

    .permission-modal {
      background: rgba(13, 31, 60, 0.95);
      border: 2px solid rgba(0, 212, 255, 0.3);
      border-radius: 20px;
      padding: 0;
      box-shadow: 
        0 0 40px rgba(0, 212, 255, 0.3),
        inset 0 0 40px rgba(0, 212, 255, 0.05);
      backdrop-filter: blur(10px);
      animation: modalFadeIn 0.5s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(-20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      padding: 30px 40px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
      border-radius: 18px 18px 0 0;
    }

    .modal-title {
      color: #00d4ff;
      font-size: 28px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.6);
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .modal-title::before {
      content: '🔐';
      font-size: 32px;
      filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.8));
    }

    .user-info {
      color: #66d9ef;
      font-size: 16px;
      margin-top: 10px;
      padding: 12px 20px;
      background: rgba(0, 212, 255, 0.05);
      border-left: 3px solid #00ff66;
      border-radius: 5px;
    }

    .user-info .username {
      color: #00ff66;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }

    .user-info .nickname {
      color: #999;
      margin-left: 10px;
    }

    .modal-body {
      padding: 40px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(0, 212, 255, 0.2);
    }

    .section-title {
      color: #00d4ff;
      font-size: 20px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-title::before {
      content: '📋';
      font-size: 24px;
    }

    .permission-stats {
      display: flex;
      gap: 20px;
      font-size: 14px;
    }

    .stat-item {
      padding: 8px 16px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 20px;
      color: #00d4ff;
      font-weight: bold;
    }

    .stat-number {
      color: #00ff66;
      font-size: 18px;
      margin-left: 5px;
    }

    .quick-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .quick-btn {
      padding: 12px 20px;
      background: rgba(0, 212, 255, 0.1);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 10px;
      color: #00d4ff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .quick-btn:hover {
      background: rgba(0, 212, 255, 0.2);
      border-color: #00d4ff;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
      transform: translateY(-2px);
    }

    .permissions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      max-height: 600px;
      overflow-y: auto;
      padding-right: 10px;
    }

    /* 自定义滚动条 */
    .permissions-grid::-webkit-scrollbar {
      width: 8px;
    }

    .permissions-grid::-webkit-scrollbar-track {
      background: rgba(0, 212, 255, 0.05);
      border-radius: 10px;
    }

    .permissions-grid::-webkit-scrollbar-thumb {
      background: rgba(0, 212, 255, 0.3);
      border-radius: 10px;
      transition: background 0.3s;
    }

    .permissions-grid::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 212, 255, 0.5);
    }

    .permission-card {
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(0, 212, 255, 0.02) 100%);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 12px;
      padding: 16px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .permission-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .permission-card:hover::before {
      left: 100%;
    }

    .permission-card:hover {
      border-color: #00d4ff;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 212, 255, 0.05) 100%);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
      transform: translateY(-3px);
    }

    .permission-card.active {
      border-color: #00ff66;
      background: linear-gradient(135deg, rgba(0, 255, 102, 0.1) 0%, rgba(0, 255, 102, 0.05) 100%);
    }

    .permission-card.active::after {
      content: '✓';
      position: absolute;
      top: 10px;
      right: 10px;
      width: 24px;
      height: 24px;
      background: #00ff66;
      color: #001529;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
      animation: checkMark 0.3s ease-out;
    }

    @keyframes checkMark {
      0% { transform: scale(0) rotate(-180deg); }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0deg); }
    }

    .permission-checkbox {
      display: none;
    }

    .permission-content {
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .permission-icon {
      font-size: 24px;
      filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.5));
      transition: all 0.3s ease;
    }

    .permission-card:hover .permission-icon {
      transform: scale(1.2) rotate(5deg);
      filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.8));
    }

    .permission-card.active .permission-icon {
      filter: drop-shadow(0 0 10px rgba(0, 255, 102, 0.8));
    }

    .permission-label {
      flex: 1;
    }

    .permission-name {
      color: #00d4ff;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      transition: color 0.3s;
    }

    .permission-card.active .permission-name {
      color: #00ff66;
    }

    .permission-desc {
      color: #66d9ef;
      font-size: 12px;
      opacity: 0.7;
    }

    .modal-footer {
      padding: 25px 40px;
      border-top: 1px solid rgba(0, 212, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 212, 255, 0.03);
      border-radius: 0 0 18px 18px;
    }

    .footer-info {
      color: #66d9ef;
      font-size: 14px;
    }

    .footer-actions {
      display: flex;
      gap: 15px;
    }

    .btn {
      padding: 12px 32px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      transition: width 0.5s, height 0.5s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .btn-cancel {
      background: rgba(255, 77, 79, 0.1);
      border: 1px solid rgba(255, 77, 79, 0.3);
      color: #ff4d4f;
    }

    .btn-cancel:hover {
      background: rgba(255, 77, 79, 0.2);
      border-color: #ff4d4f;
      box-shadow: 0 0 20px rgba(255, 77, 79, 0.4);
      transform: translateY(-2px);
    }

    .btn-save {
      background: linear-gradient(135deg, #00d4ff 0%, #00a3cc 100%);
      color: #001529;
      box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4);
    }

    .btn-save:hover {
      background: linear-gradient(135deg, #00e5ff 0%, #00b8e6 100%);
      box-shadow: 0 6px 25px rgba(0, 212, 255, 0.6);
      transform: translateY(-2px);
    }

    .btn-text {
      position: relative;
      z-index: 1;
    }

    /* 分类标签 */
    .category-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      padding: 3px 8px;
      background: rgba(0, 212, 255, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.3);
      border-radius: 4px;
      font-size: 10px;
      color: #00d4ff;
      font-weight: bold;
      z-index: 2;
    }

    .permission-card.active .category-tag {
      background: rgba(0, 255, 102, 0.2);
      border-color: rgba(0, 255, 102, 0.3);
      color: #00ff66;
    }

    /* 响应式设计 */
    @media (max-width: 768px) {
      .permissions-grid {
        grid-template-columns: 1fr;
      }

      .modal-header,
      .modal-body,
      .modal-footer {
        padding: 20px;
      }

      .quick-actions {
        flex-direction: column;
      }
    }
  </style>
</head>

  <script>
    // 更新统计数字
    function updateStats() {
      const cards = document.querySelectorAll('.permission-card');
      const selected = document.querySelectorAll('.permission-card.active').length;
      const total = cards.length;
      
      document.getElementById('selectedCount').textContent = selected;
      document.getElementById('unselectedCount').textContent = total - selected;
    }

    // 为所有权限卡片添加点击事件
    document.querySelectorAll('.permission-card').forEach(card => {
      card.addEventListener('click', function(e) {
        // 如果点击的是checkbox自己，不处理
        if (e.target.classList.contains('permission-checkbox')) return;
        
        this.classList.toggle('active');
        const checkbox = this.querySelector('.permission-checkbox');
        checkbox.checked = this.classList.contains('active');
        updateStats();
      });
    });

    // 全选
    function selectAll() {
      document.querySelectorAll('.permission-card').forEach(card => {
        card.classList.add('active');
        card.querySelector('.permission-checkbox').checked = true;
      });
      updateStats();
    }

    // 全不选
    function deselectAll() {
      document.querySelectorAll('.permission-card').forEach(card => {
        card.classList.remove('active');
        card.querySelector('.permission-checkbox').checked = false;
      });
      updateStats();
    }



    // 保存权限
    function savePermissions() {
      const permissions = {};
      document.querySelectorAll('.permission-card').forEach(card => {
        const key = card.getAttribute('data-key');
        permissions[key] = card.classList.contains('active');
      });
      
      console.log('保存的权限配置:', permissions);
      
      // 显示成功提示
      alert('✅ 权限保存成功！已选择 ' + Object.values(permissions).filter(v => v).length + ' 项权限');
    }

    // 关闭模态框
    function closeModal() {
      if (confirm('确定要关闭吗？未保存的更改将丢失。')) {
        console.log('关闭模态框');
      }
    }

    // 初始化统计
    updateStats();
  </script>
